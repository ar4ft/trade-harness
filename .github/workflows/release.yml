name: Signed release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sign_release:
        description: 'Sign and publish a stable release (manual runs on version tags only)'
        type: boolean
        default: false
      notarize_macos:
        description: 'Include signed/notarized macOS installer (Apple secrets required)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate version and require a tag for manual signing
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          SIGN_RELEASE: ${{ inputs.sign_release }}
        run: |
          python - <<'PY'
          import os, re, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version)
          if os.environ['SIGN_RELEASE'] == 'true':
              assert os.environ['EVENT_NAME'] == 'workflow_dispatch', 'Signing requires manual dispatch'
              assert os.environ['RELEASE_REF_TYPE'] == 'tag', 'Sign a version tag, never main'
          if os.environ['RELEASE_REF_TYPE'] == 'tag':
              assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match package version'
          PY
      - run: pip install -e '.[dev]' build
      - run: ruff check .
      - run: pytest -q
      - run: python -m build --wheel
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-wheel
          path: dist/*.whl
          if-no-files-found: error

  macos:
    needs: wheel
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release == true && (vars.MACOS_NOTARIZATION_ENABLED == 'true' || inputs.notarize_macos == true) }}
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: portable-wheel
          path: release
      - run: pip install -e .
      - name: Stage universal Python launcher and trusted wheel
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          python scripts/build_macos_payload.py --version "$VERSION" \
            --wheel "release/trade_harness-${VERSION}-py3-none-any.whl"
          python -m py_compile artifacts/macos-payload/usr/local/share/trade-harness/bootstrap.py
      - name: Sign installer, submit notarization, and staple ticket
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          MACOS_INSTALLER_P12_BASE64: ${{ secrets.MACOS_INSTALLER_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os
          from pathlib import Path
          names = ['MACOS_INSTALLER_P12_BASE64', 'MACOS_CERT_PASSWORD', 'MACOS_INSTALLER_IDENTITY',
                   'APPLE_API_KEY_P8_BASE64', 'APPLE_API_KEY_ID', 'APPLE_API_ISSUER_ID']
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing Apple secrets: ' + ', '.join(missing))
          root = Path(os.environ['RUNNER_TEMP'])
          for name, filename in [('MACOS_INSTALLER_P12_BASE64', 'installer.p12'),
                                 ('APPLE_API_KEY_P8_BASE64', 'notarization.p8')]:
              path = root / filename
              path.write_bytes(base64.b64decode(os.environ[name], validate=True))
              path.chmod(0o600)
          PY
          KEYCHAIN="$RUNNER_TEMP/release-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          trap 'security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true; rm -f "$RUNNER_TEMP/installer.p12" "$RUNNER_TEMP/notarization.p8"' EXIT
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/pkgbuild -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          VERSION="${RELEASE_TAG#v}"
          PACKAGE="release/trade-harness-${VERSION}-macos-universal.pkg"
          pkgbuild --root artifacts/macos-payload --identifier com.ar4ft.trade-harness \
            --version "$VERSION" --install-location / --sign "$MACOS_INSTALLER_IDENTITY" \
            --keychain "$KEYCHAIN" "$PACKAGE"
          pkgutil --check-signature "$PACKAGE"
          xcrun notarytool submit "$PACKAGE" --key "$RUNNER_TEMP/notarization.p8" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notarization-result.json"
          python - <<'PY'
          import json, os
          result = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'notarization-result.json')))
          if result.get('status') != 'Accepted':
              raise SystemExit('Apple did not accept this installer; no release will be published')
          PY
          xcrun stapler staple "$PACKAGE"
          xcrun stapler validate "$PACKAGE"
          spctl --assess --type install --verbose "$PACKAGE"
      - name: Remove temporary signing material
        if: ${{ always() }}
        run: |
          security delete-keychain "$RUNNER_TEMP/release-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/installer.p12" "$RUNNER_TEMP/notarization.p8"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notarized-macos
          path: release/*.pkg
          if-no-files-found: error

  publish:
    needs: [wheel, macos]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.sign_release == true && needs.wheel.result == 'success' && (needs.macos.result == 'success' || needs.macos.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*'
          merge-multiple: true
          path: release
      - run: pip install -e .
      - name: Create manifest and sign with GitHub OIDC identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python scripts/release_manifest.py --version "${RELEASE_TAG#v}" --commit "$RELEASE_COMMIT"
          python -m sigstore sign --bundle release/release-manifest.sigstore.json release/release-manifest.json
          python -m sigstore verify github --bundle release/release-manifest.sigstore.json \
            --cert-identity "https://github.com/ar4ft/trade-harness/.github/workflows/release.yml@refs/tags/$RELEASE_TAG" \
            --trigger workflow_dispatch --repository ar4ft/trade-harness \
            --ref "refs/tags/$RELEASE_TAG" release/release-manifest.json
      - name: Publish only after signing succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ar4ft/trade-harness
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; never overwrite a published version.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Trade Harness $RELEASE_TAG" \
            --notes-file docs/release-notes.md release/*
          gh release edit "$RELEASE_TAG" --draft=false --latest
